services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: SB_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SB_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/SB_db?schema=public"
      PORT: 4000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:8080
      WEB_ORIGIN: http://localhost:8080
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET, e.g. openssl rand -hex 32}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET, e.g. openssl rand -hex 32}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Set ENCRYPTION_KEY, e.g. openssl rand -base64 32}"
      RATE_LIMIT_MAX: 300
      UPLOAD_DIR: /data/uploads
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - server-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/public/health').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  server-data:
  db-data:
